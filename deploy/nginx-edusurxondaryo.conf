# Serverdagi mavjud nginx uchun edusurxondaryo.uz bloki. Joylashtirish:
#   sudo cp deploy/nginx-edusurxondaryo.conf /etc/nginx/sites-available/edusurxondaryo.uz
#   sudo ln -s /etc/nginx/sites-available/edusurxondaryo.uz /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d edusurxondaryo.uz -d www.edusurxondaryo.uz     # HTTPS sertifikat; certbot bu blokni o'zi 443 ga o'zgartiradi
# Boshqa saytlarga tegmaydi: faqat shu server_name bo'yicha ishlaydi. Docker'dagi web konteyner 127.0.0.1:8088 da (docker-compose.yml, WEB_PORT).
server {
    listen 80;
    listen [::]:80;
    server_name edusurxondaryo.uz www.edusurxondaryo.uz;

    # O'quvchi/xodim rasmlari (8 MB gacha) va Excel import uchun
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Backend https ekanini shu sarlavhadan biladi (HSTS, havolalar); docker-compose da TRUST_PROXY=2 (shu nginx + web konteyner)
        proxy_set_header X-Forwarded-Proto $scheme;
        # «Jonli sinov» tahlili va katta importlar uchun
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
