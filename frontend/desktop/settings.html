<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<title>Sozlamalar</title>
<style>
	body {
		margin: 0;
		font-family: "Segoe UI", Tahoma, sans-serif;
		background: #f1f5f9;
		color: #1e293b;
		display: flex;
		flex-direction: column;
		height: 100vh;
		box-sizing: border-box;
		padding: 24px;
	}
	h1 {
		font-size: 16px;
		margin: 0 0 4px;
	}
	p.hint {
		font-size: 12px;
		color: #64748b;
		margin: 0 0 16px;
	}
	label {
		font-size: 13px;
		font-weight: 600;
		display: block;
		margin-bottom: 6px;
	}
	input[type="text"] {
		width: 100%;
		box-sizing: border-box;
		padding: 10px 12px;
		border: 1px solid #cbd5e1;
		border-radius: 8px;
		font-size: 14px;
		outline: none;
	}
	input[type="text"]:focus {
		border-color: #2563eb;
		box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.15);
	}
	.msg {
		font-size: 12px;
		min-height: 18px;
		margin-top: 8px;
	}
	.msg.error { color: #dc2626; }
	.msg.success { color: #16a34a; }
	.actions {
		margin-top: auto;
		display: flex;
		justify-content: flex-end;
		gap: 8px;
	}
	button {
		border: none;
		border-radius: 8px;
		padding: 10px 18px;
		font-size: 13px;
		font-weight: 600;
		cursor: pointer;
	}
	button.cancel {
		background: #e2e8f0;
		color: #334155;
	}
	button.save {
		background: #2563eb;
		color: white;
	}
	button.save:disabled {
		opacity: 0.6;
		cursor: default;
	}
</style>
</head>
<body>
	<h1>Server manzili</h1>
	<p class="hint">Ilova ulanadigan FaceID tizimi manzili. O'zgartirilgach oyna shu manzilga qayta yuklanadi.</p>
	<label for="url">Manzil</label>
	<input type="text" id="url" placeholder="https://faceid-paxtachi.uz/" autocomplete="off" />
	<div class="msg" id="msg"></div>
	<div class="actions">
		<button class="cancel" id="cancelBtn">Bekor</button>
		<button class="save" id="saveBtn">Saqlash</button>
	</div>

	<script>
		const urlInput = document.getElementById("url")
		const msg = document.getElementById("msg")
		const saveBtn = document.getElementById("saveBtn")
		const cancelBtn = document.getElementById("cancelBtn")

		window.settingsAPI.getServerUrl().then((url) => { urlInput.value = url })

		cancelBtn.addEventListener("click", () => window.settingsAPI.close())

		saveBtn.addEventListener("click", async () => {
			msg.textContent = ""
			msg.className = "msg"
			saveBtn.disabled = true
			const result = await window.settingsAPI.setServerUrl(urlInput.value)
			if (result.success) {
				msg.textContent = "Saqlandi. Ilova qayta yuklanmoqda…"
				msg.className = "msg success"
				setTimeout(() => window.settingsAPI.close(), 800)
			} else {
				msg.textContent = result.message
				msg.className = "msg error"
				saveBtn.disabled = false
			}
		})
	</script>
</body>
</html>
